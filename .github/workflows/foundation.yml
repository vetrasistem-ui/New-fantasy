name: Foundation Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project layout and contracts
        shell: pwsh
        run: ./scripts/check-layout.ps1

      - name: Validate Fantasy Project v2
        shell: pwsh
        run: ./scripts/validate-project.ps1

      - name: Validate FMAP v0
        shell: pwsh
        run: ./scripts/validate-fmap.ps1

      - name: Validate FMAP multi-chunk semantics
        shell: pwsh
        run: ./scripts/validate-fmap-multichunk.ps1

      - name: Validate Fantasy Protocol v1
        shell: pwsh
        run: ./scripts/validate-protocol.ps1

      - name: Test project relocation
        shell: pwsh
        run: ./scripts/test-project-relocation.ps1

      - name: Record toolchain
        shell: pwsh
        run: |
          Write-Host "OS=$([System.Environment]::OSVersion.VersionString)"
          cmake --version
          git --version

      - name: Configure Fantasy Studio
        shell: pwsh
        run: cmake -S Studio -B build/studio

      - name: Build Fantasy Studio
        shell: pwsh
        run: cmake --build build/studio --config Release

      - name: Test Fantasy Studio Project Manager
        shell: pwsh
        run: ctest --test-dir build/studio -C Release --output-on-failure

      - name: Upload Fantasy Studio Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-studio-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/studio/Release/fantasy-studio.exe
            build/studio/Release/FantasyStudio.exe
            build/studio/Release/fantasy-legacy-inspect.exe
            build/studio/Release/fantasy-legacy-preview.exe
            build/studio/Release/fantasy-map-generate.exe
            build/studio/Release/StudioVisual/

      - name: Configure Fantasy Server
        shell: pwsh
        run: cmake -S Server -B build/server

      - name: Build Fantasy Server
        shell: pwsh
        run: cmake --build build/server --config Release

      - name: Test Fantasy Server and native play integration
        shell: pwsh
        run: ctest --test-dir build/server -C Release --output-on-failure

      - name: Configure Fantasy Client
        shell: pwsh
        run: cmake -S Client -B build/client

      - name: Build Fantasy Client
        shell: pwsh
        run: cmake --build build/client --config Release

      - name: Smoke-test Fantasy Client
        shell: pwsh
        run: ctest --test-dir build/client -C Release --output-on-failure

      - name: Prove two-process native play
        shell: pwsh
        run: ./scripts/run-native-play.ps1 -Configuration Release -Port 17171 -Character "CI Hero"

      - name: Upload Fantasy native runtime Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-native-runtime-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/server/Release/fantasy-server.exe
            build/client/Release/fantasy-client.exe
            build/client/Release/fantasy-client-gui.exe

  legacy-tool-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure legacy tools and runtime backend
        run: cmake -S Studio -B build/studio -DCMAKE_BUILD_TYPE=Release -DSDL_UNIX_CONSOLE_BUILD=ON

      - name: Build Linux legacy tools and TFS1098 workflow tests
        run: cmake --build build/studio --target fantasy-legacy-inspect fantasy-legacy-preview fantasy-runtime-backend-tests fantasy-tfs1098-workflow-tests --parallel 2

      - name: Test TFS1098 runtime workflows on Linux
        run: ctest --test-dir build/studio -R '^fantasy-(runtime-backend|tfs1098-workflow)-tests$' --output-on-failure

      - name: Upload Linux legacy tools
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-legacy-tools-linux-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/studio/fantasy-legacy-inspect
            build/studio/fantasy-legacy-preview
