name: Asset Catalog V1

on:
  pull_request:
    paths:
      - "Tools/AssetCatalog/**"
      - "Studio/Foundation/FantasyAssetCatalog.hpp"
      - "Studio/Foundation/FantasyAuthoringRepository.hpp"
      - "Studio/Foundation/FantasyProjectHealthScanner.hpp"
      - "Studio/Foundation/FantasyProjectLayoutV2.hpp"
      - ".github/workflows/asset-catalog-v1.yml"
  workflow_dispatch:

jobs:
  cli-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Asset Catalog CLI contract tests
        run: python -m unittest discover -s Tools/AssetCatalog -p "test_*.py" -v
