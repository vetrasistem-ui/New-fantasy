name: OTCv8 Visual Homologation Client

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/otcv8-visual-homologation.yml
      - Tools/Tfs1098/tfs1098_protocol_probe.py
      - Tools/Tfs1098/tfs1098_mysql_fixture.py

jobs:
  stage-linux-client:
    runs-on: ubuntu-latest
    steps:
      - name: Download clean public OTCv8 package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o otcv8.zip \
            https://github.com/OTCv8/otclientv8/archive/refs/heads/master.zip
          unzip -q otcv8.zip
          CLIENT_DIR="$(find . -maxdepth 1 -type d -name 'otclientv8-*' | head -n1)"
          test -n "${CLIENT_DIR}"
          test -f "${CLIENT_DIR}/otclient_linux"
          test -d "${CLIENT_DIR}/modules"
          test -d "${CLIENT_DIR}/data"
          rm -rf "${CLIENT_DIR}/data/things" || true
          mkdir -p staged-client
          cp "${CLIENT_DIR}/otclient_linux" staged-client/
          cp "${CLIENT_DIR}/init.lua" staged-client/
          cp -a "${CLIENT_DIR}/modules" staged-client/
          cp -a "${CLIENT_DIR}/mods" staged-client/ 2>/dev/null || true
          cp -a "${CLIENT_DIR}/data" staged-client/
          cp -a "${CLIENT_DIR}/layouts" staged-client/ 2>/dev/null || true
          chmod +x staged-client/otclient_linux
          printf 'source=https://github.com/OTCv8/otclientv8\nbranch=master\nplatform=linux\n' > staged-client/HOMOLOGATION-SOURCE.txt
          cat > staged-client/ASSETS-REQUIRED.txt <<'EOF'
          This public homologation client intentionally contains no Tibia DAT/SPR assets.
          For Fantasy 10.98 acceptance, place the matching user-owned files at:
            data/things/1098/Tibia.dat
            data/things/1098/Tibia.spr
          Keep the matching OTFI/OTML profile used by the project when required.
          EOF

      - name: Upload Linux homologation client
        uses: actions/upload-artifact@v4
        with:
          name: otcv8-linux-visual-homologation-${{ github.sha }}
          path: staged-client
          if-no-files-found: error

  stage-windows-client:
    runs-on: windows-latest
    steps:
      - name: Download clean public OTCv8 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/OTCv8/otclientv8/archive/refs/heads/master.zip' -OutFile 'otcv8.zip'
          Expand-Archive -Path 'otcv8.zip' -DestinationPath '.' -Force
          $client = Get-ChildItem -Directory -Filter 'otclientv8-*' | Select-Object -First 1
          if (-not $client) { throw 'OTCv8 extracted directory was not found' }
          $root = $client.FullName

          foreach ($required in @('otclient_dx.exe', 'otclient_gl.exe', 'init.lua', 'modules', 'data')) {
            if (-not (Test-Path (Join-Path $root $required))) { throw "Missing OTCv8 package entry: $required" }
          }

          Remove-Item -Recurse -Force (Join-Path $root 'data\things') -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path 'staged-client-windows' -Force | Out-Null

          foreach ($file in @('otclient_dx.exe', 'otclient_gl.exe', 'd3dcompiler_47.dll', 'libEGL.dll', 'libGLESv2.dll', 'init.lua')) {
            $source = Join-Path $root $file
            if (Test-Path $source) { Copy-Item $source 'staged-client-windows\' -Force }
          }
          foreach ($dir in @('modules', 'mods', 'data', 'layouts')) {
            $source = Join-Path $root $dir
            if (Test-Path $source) { Copy-Item $source (Join-Path 'staged-client-windows' $dir) -Recurse -Force }
          }

          @"
          source=https://github.com/OTCv8/otclientv8
          branch=master
          platform=windows
          "@ | Set-Content -Path 'staged-client-windows\HOMOLOGATION-SOURCE.txt' -Encoding ascii

          @"
          This public homologation client intentionally contains no Tibia DAT/SPR assets.
          For Fantasy 10.98 acceptance, place the matching user-owned files at:
            data\things\1098\Tibia.dat
            data\things\1098\Tibia.spr
          Keep the matching OTFI/OTML profile used by the project when required.
          Use otclient_dx.exe first; otclient_gl.exe is available as an alternate renderer.
          "@ | Set-Content -Path 'staged-client-windows\ASSETS-REQUIRED.txt' -Encoding ascii

          if ((Get-Item 'staged-client-windows\otclient_dx.exe').Length -le 0) { throw 'DX client is empty' }
          if ((Get-Item 'staged-client-windows\otclient_gl.exe').Length -le 0) { throw 'GL client is empty' }

      - name: Upload Windows homologation client
        uses: actions/upload-artifact@v4
        with:
          name: otcv8-windows-visual-homologation-${{ github.sha }}
          path: staged-client-windows
          if-no-files-found: error

  windows-tfs-protocol-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout Fantasy homologation tools
        uses: actions/checkout@v4

      - name: Prepare OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gitOpenSsl = 'C:\Program Files\Git\usr\bin'
          if ((Test-Path (Join-Path $gitOpenSsl 'openssl.exe')) -and -not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $env:Path = "$gitOpenSsl;$env:Path"
            "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          openssl version
          python --version

      - name: Download official TFS 1.4.2 Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/otland/forgottenserver/releases/download/v1.4.2/tfs-v1.4.2-windows-vcpkg.zip' -OutFile 'tfs-windows.zip'
          Expand-Archive -Path 'tfs-windows.zip' -DestinationPath 'tfs-windows' -Force
          $exe = Get-ChildItem 'tfs-windows' -Recurse -Filter 'tfs.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Official TFS Windows executable was not found' }
          $runtime = $exe.Directory.FullName
          "TFS_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Test-Path (Join-Path $runtime 'config.lua.dist'))) { throw 'config.lua.dist was not found beside TFS' }
          if (-not (Test-Path (Join-Path $runtime 'key.pem'))) { throw 'key.pem was not found beside TFS' }

      - name: Configure TFS and start deterministic DB fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configDist = Join-Path $env:TFS_RUNTIME 'config.lua.dist'
          $configPath = Join-Path $env:TFS_RUNTIME 'config.lua'
          $config = Get-Content $configDist -Raw
          $config = $config.Replace('mysqlPass = ""', 'mysqlPass = "fantasy-ci"')
          $config = $config.Replace('ip = "127.0.0.1"', 'ip = "127.0.0.1"')
          Set-Content -Path $configPath -Value $config -Encoding utf8

          $fixtureOut = Join-Path $PWD 'mysql-fixture.out.log'
          $fixtureErr = Join-Path $PWD 'mysql-fixture.err.log'
          $fixtureQueryLog = Join-Path $PWD 'mysql-fixture.queries.log'
          $fixture = Start-Process -FilePath 'python' -ArgumentList @(
            'Tools/Tfs1098/tfs1098_mysql_fixture.py', '--host', '127.0.0.1', '--port', '3306', '--log', $fixtureQueryLog
          ) -PassThru -RedirectStandardOutput $fixtureOut -RedirectStandardError $fixtureErr
          $fixture.Id | Set-Content 'mysql-fixture.pid'

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path $fixtureOut) {
              $text = Get-Content $fixtureOut -Raw -ErrorAction SilentlyContinue
              if ($text -match 'TFS1098_MYSQL_FIXTURE READY') { $ready = $true; break }
            }
            if ($fixture.HasExited) {
              Get-Content $fixtureErr -ErrorAction SilentlyContinue
              throw 'MySQL fixture exited before readiness'
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw 'MySQL fixture did not become ready' }

      - name: Start official Windows TFS and run protocol 10.98 smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tfsExe = Join-Path $env:TFS_RUNTIME 'tfs.exe'
          $tfsOut = Join-Path $PWD 'tfs-windows.out.log'
          $tfsErr = Join-Path $PWD 'tfs-windows.err.log'
          $tfs = Start-Process -FilePath $tfsExe -WorkingDirectory $env:TFS_RUNTIME -PassThru -RedirectStandardOutput $tfsOut -RedirectStandardError $tfsErr
          $tfs.Id | Set-Content 'tfs-windows.pid'

          try {
            $online = $false
            for ($i = 0; $i -lt 120; $i++) {
              if (Test-Path $tfsOut) {
                $text = Get-Content $tfsOut -Raw -ErrorAction SilentlyContinue
                if ($text -match 'Forgotten Server Online!') { $online = $true; break }
              }
              if ($tfs.HasExited) {
                Get-Content $tfsOut -ErrorAction SilentlyContinue
                Get-Content $tfsErr -ErrorAction SilentlyContinue
                throw 'Official Windows TFS exited before Online'
              }
              Start-Sleep -Seconds 1
            }
            if (-not $online) { throw 'Official Windows TFS did not reach Online' }

            python Tools/Tfs1098/tfs1098_protocol_probe.py `
              --host 127.0.0.1 --port 7172 `
              --key (Join-Path $env:TFS_RUNTIME 'key.pem') `
              --account fantasy --password fantasy --character 'Fantasy Test' --timeout 15
          }
          finally {
            if (-not $tfs.HasExited) { Stop-Process -Id $tfs.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Stop fixture
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'mysql-fixture.pid') {
            $fixturePid = Get-Content 'mysql-fixture.pid'
            Stop-Process -Id $fixturePid -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows runtime smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfs1098-windows-protocol-smoke-${{ github.sha }}
          path: |
            tfs-windows.out.log
            tfs-windows.err.log
            mysql-fixture.out.log
            mysql-fixture.err.log
            mysql-fixture.queries.log
          if-no-files-found: warn
